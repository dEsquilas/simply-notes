name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Pest, 100% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same PHP minor version as production
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, zip, gd, fileinfo, pdo_sqlite
          coverage: pcov

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests with coverage gate
        run: vendor/bin/pest --testsuite=Unit,Feature,Arch --parallel --coverage --min=100

  browser:
    # Browser tests are the slow part: split them across 3 runners with Pest's sharding
    name: Browser (Pest + Playwright, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, zip, gd, fileinfo, pdo_sqlite, sockets
          coverage: none

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Playwright pins its browser build in the lockfile: reuse the download while it does not change
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright's Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium's system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build assets
        run: pnpm run build

      - name: Run browser tests
        run: vendor/bin/pest --testsuite=Browser --ci --shard=${{ matrix.shard }}/3

      - name: Upload failure screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.shard }}
          path: |
            tests/Browser/Screenshots
            storage/logs
          if-no-files-found: ignore
