name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Pest, 100% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same PHP minor version as production
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, zip, gd, fileinfo, pdo_sqlite
          coverage: pcov

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests with coverage gate
        run: vendor/bin/pest --coverage --min=100

  browser:
    name: Browser (Dusk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, zip, gd, fileinfo, pdo_sqlite
          coverage: none

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ChromeDriver for the runner's Chrome
        run: php artisan dusk:chrome-driver --detect

      - name: Run browser tests
        run: scripts/dusk.sh

      - name: Upload failure screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-failures
          path: |
            tests/browser/screenshots
            tests/browser/console
            storage/logs
          if-no-files-found: ignore
